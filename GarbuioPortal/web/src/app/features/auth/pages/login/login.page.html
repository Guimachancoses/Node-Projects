@if (loginRequest$ | async; as request) {
  <po-page-login
    p-logo="totvs.svg"
    p-secondary-logo="totvs.svg"
    p-product-name="Garbuio Portal"
    [p-login]="rememberedUser"
    [p-loading]="request.status === 'loading'"
    [p-hide-remember-user]="false"
    (p-login-submit)="submit($event)"
  />
}
