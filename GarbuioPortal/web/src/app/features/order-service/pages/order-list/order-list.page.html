<po-page-default p-title="Ordens de serviço" [p-actions]="pageActions">
  @if (loading$ | async) {
    <po-loading-overlay [p-screen-lock]="true" p-text="Consultando ordens de serviço" />
  }

  <app-order-filter
    [referenceData]="referenceData$ | async"
    [loading]="(loading$ | async) ?? false"
    (search)="search($event)"
    (openLookup)="openLookup($event)"
  />

  <po-table
    [p-actions]="tableActions"
    [p-columns]="columns"
    [p-items]="(orders$ | async) ?? []"
    [p-loading]="(loading$ | async) ?? false"
    p-no-data="Nenhuma ordem de serviço encontrada"
    [p-striped]="true"
  />

  @if (pagination$ | async; as pagination) {
    <div class="pagination-bar" aria-label="Paginação das ordens de serviço">
      <po-select
        class="page-size"
        name="orderPageSize"
        p-label="Registros por página"
        [p-options]="pageSizeOptions"
        [ngModel]="pagination.pageSize"
        [p-disabled]="(loading$ | async) ?? false"
        (ngModelChange)="changePageSize($event)"
      />

      <div class="pagination-navigation">
        <span class="page-indicator">Página {{ pagination.page }}</span>
        <po-button
          p-icon="an an-caret-left"
          p-label="Anterior"
          [p-disabled]="pagination.page <= 1 || ((loading$ | async) ?? false)"
          (p-click)="previousPage(pagination.page)"
        />
        <po-button
          p-icon="an an-caret-right"
          p-label="Próxima"
          [p-disabled]="!pagination.hasNext || ((loading$ | async) ?? false)"
          (p-click)="nextPage(pagination.page)"
        />
      </div>
    </div>
  }
</po-page-default>

@if (lookupPagination$ | async; as lookupPagination) {
  <app-lookup-modal
    [results]="(lookupItems$ | async) ?? []"
    [loading]="(lookupLoading$ | async) ?? false"
    [page]="lookupPagination.page"
    [pageSize]="lookupPagination.pageSize"
    [hasNext]="lookupPagination.hasNext"
    (search)="searchLookup($event)"
    (selected)="selectLookup($event)"
    (closed)="closeLookup()"
  />
}
