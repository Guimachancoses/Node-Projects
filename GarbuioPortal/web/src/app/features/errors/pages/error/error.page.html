<main class="error-page">
  <section class="error-card" [attr.aria-labelledby]="'error-title-' + data.code">
    <po-icon class="error-icon" p-icon="an an-warning-circle" />
    <p class="error-code">Erro {{ data.code }}</p>
    <h1 [id]="'error-title-' + data.code">{{ data.title }}</h1>
    <p class="error-message">{{ data.message }}</p>
    <div class="error-actions">
      <po-button p-label="Voltar" p-kind="secondary" (p-click)="goBack()" />
      <po-button p-label="Ir para ordens" (p-click)="goHome()" />
    </div>
  </section>
</main>
