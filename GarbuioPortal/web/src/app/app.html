@if (showShell()) {
  <po-menu
    p-logo="totvs.svg"
    p-short-logo="totvs-favicon.png"
    p-logo-alt="TOTVS"
    [p-collapsed]="menuCollapsed"
    [p-menus]="menus()"
    (p-toggle)="onMenuToggle($event)"
  />

  <main
    class="po-wrapper"
    aria-label="Conteúdo principal"
    [class.po-collapsed-menu]="menuCollapsed"
  >
    <router-outlet />
  </main>
} @else {
  <router-outlet />
}
